[project]
name = "fantasy-drafter"
version = "1.1.0"
description = "Superflex dynasty fantasy football draft board and decision assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "players-data.js",
    "players-data.json",
    "data",
    "logs",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line length handled by ruff format
    "RUF012", # mutable class default
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty]
exclude = [
    "players-data.js",
    "players-data.json",
    "data/**",
    "logs/**",
]

