<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy Draft Board — Superflex Dynasty</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏈</text></svg>">
  <link rel="stylesheet" href="css/draft-board.css">
</head>

<body>

  <header>
    <div class="hrow">
      <h1 id="leaguetitle">🏈 Ken's Draft Board</h1>
      <span id="clock" class="clock">—</span>
      <span id="nextpicks" class="nextpicks"></span>
      <span style="margin-left:auto"></span>
      <button class="act" id="boardbtn" onclick="openDraftBoardModal()"
        style="border-color:var(--accent); color:var(--text); font-weight:700">📊 Draft Board</button>
      <button class="act" id="syncbtn" onclick="openSyncModal()"
        style="border-color:var(--accent); color:var(--text); font-weight:600">⚡ Live Sync <span id="syncbadge"
          class="sync-badge off">OFF</span></button>
      <button class="act" id="setupbtn" style="border-color:var(--accent); color:var(--accent); font-weight:700">⚙️
        League Setup</button>
      <label class="set">Jump to pick <input type="number" id="jumppick" min="1" style="width:64px"> <button class="act"
          id="jumpbtn">Go</button></label>
      <button class="small" id="undobtn">↩ Undo last</button>
      <button class="small" id="resetbtn">Reset draft</button>
    </div>
    <div class="hrow">
      <label class="set">My slot <select id="hdrslot"></select></label>
      <label class="set">Teams <b id="hdrteams" style="color:var(--text)">12</b></label>
      <label class="set">Rounds <input type="number" id="rounds" min="1" max="40"></label>
      <label class="set">Order <select id="mode">
          <option value="3rr">3rd-Round Reversal</option>
          <option value="snake">Normal snake</option>
        </select></label>
      <label class="set">League <select id="hdrleaguetype">
          <option value="dynasty">Dynasty</option>
          <option value="redraft">Redraft</option>
        </select></label>
      <label class="set">Scoring <select id="hdrscoring">
          <option value="half">0.5 Half-PPR</option>
          <option value="ppr">Full PPR</option>
          <option value="std">Standard</option>
        </select></label>
      <label class="set">QB Mode <select id="hdrqb">
          <option value="sf">Superflex (2QB)</option>
          <option value="1qb">1 QB</option>
        </select></label>
      <label class="set"><input type="checkbox" id="teprem"> TE prem</label>
      <label class="set">Win-now <input type="range" id="blend" min="0" max="100" step="5"> Dynasty <span id="blendval"
          style="color:var(--text)"></span></label>
    </div>
  </header>

  <main>
    <!-- Left Side: Always shows OUR roster & team composition, plus Watchlist -->
    <aside class="side left-side">
      <div class="panel">
        <div class="roster-header">
          <h2 id="myrosterheader" style="color:var(--good); display:flex; align-items:center; gap:6px; margin:0">
            ⭐ My Roster
          </h2>
        </div>
        <div id="myroster" style="max-height: 38vh; overflow-y: auto;"></div>
        <div class="needs" id="myneeds"></div>
        <div id="mybyewarn"></div>
      </div>
      <div class="panel">
        <div class="roster-header">
          <h2 style="color:var(--warn); display:flex; align-items:center; gap:6px; margin:0">
            ⭐ Watchlist
          </h2>
          <span id="mywatchlistcount" class="meta" style="font-size:12px; font-weight:normal"></span>
        </div>
        <div id="leftwatchlist" style="max-height: 28vh; overflow-y: auto;"></div>
      </div>
    </aside>

    <!-- Center: Player Pool / Draft Board -->
    <section class="panel pool-panel">
      <div id="databanner"></div>
      <div class="toolbar">
        <div class="tabs" id="postabs"></div>
        <input id="search" type="search" placeholder="Search player…">
        <label class="set">Sort <select id="sortsel">
            <option value="score">Draft score</option>
            <option value="dyn">Dynasty rank</option>
            <option value="red">Redraft rank</option>
            <option value="rookie">Rookie / Prospect rank</option>
            <option value="adp">ADP</option>
          </select></label>
        <label class="set"><input type="checkbox" id="hidetaken"> Hide taken</label>
        <label class="set"><input type="checkbox" id="hideoutir"> Hide Out/IR</label>
      </div>
      <div style="max-height: 72vh; overflow-y: auto;">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Player</th>
              <th>Pos</th>
              <th>Team</th>
              <th>Bye</th>
              <th class="num" id="th_dyn">Dyn SF</th>
              <th class="num" id="th_red">Redraft</th>
              <th class="num">ADP</th>
              <th class="num">Score</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="pool"></tbody>
        </table>
      </div>
    </section>

    <!-- Right Side: On-Clock Team Roster / League Inspector & Draft Log -->
    <aside class="side right-side">
      <div class="panel">
        <div class="roster-header">
          <select id="rosterTeamSelect" class="roster-select"></select>
          <button class="small" id="onclockquickbtn" style="display:none; white-space:nowrap"
            onclick="selectRosterSlot(null)">Follow Clock</button>
        </div>
        <div id="clockteamlabel" style="font-size:11.5px; color:var(--dim); margin-bottom:6px"></div>
        <div id="roster" style="max-height: 38vh; overflow-y: auto;"></div>
        <div class="needs" id="needs"></div>
        <div id="byewarn"></div>
      </div>
      <div class="panel">
        <h2>Draft Log</h2>
        <button class="act gone" id="unknownbtn" style="width:100%; margin-bottom:8px">Unlisted pick ➜</button>
        <div id="log" style="max-height: 30vh; overflow-y: auto;"></div>
      </div>
    </aside>
  </main>

  <footer id="sources"></footer>

  <div id="overlay">
    <div class="modal" id="modalbox"></div>
  </div>

  <div id="playerOverlay">
    <div class="modal" id="playerModalbox"></div>
  </div>

  <!-- Scripts -->
  <script src="draft-logic.js?v=20260831"></script>
  <script src="players-data.js?v=20260831"></script>
  <script src="js/draft-audio.js?v=20260831"></script>
  <script src="js/draft-state.js?v=20260831"></script>
  <script src="js/draft-sync-client.js?v=20260831"></script>
  <script src="js/draft-ui.js?v=20260831"></script>
  <script src="js/app.js?v=20260831"></script>
</body>

</html>
