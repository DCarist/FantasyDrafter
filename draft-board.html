<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Draft Board — Superflex Dynasty</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏈</text></svg>">
<style>
  :root {
    --bg: #12151c; --panel: #1a1f2a; --panel2: #202636; --border: #2c3550;
    --text: #e8ecf4; --dim: #8b96ad; --accent: #4f8ff7; --good: #3ddc84; --warn: #ffb454; --bad: #ff6470;
    --qb: #e05a6d; --rb: #3ddc84; --wr: #58a6ff; --te: #ffb454; --k: #c084fc; --dst: #a3e635;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 16px; }
  .hrow { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .hrow + .hrow { margin-top: 8px; }
  h1 { font-size: 16px; font-weight: 700; margin-right: 6px; white-space: nowrap; }
  label.set { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); font-size: 12px; white-space: nowrap; }
  label.set input[type=number], label.set select { width: 58px; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 3px 5px; font-size: 13px; }
  label.set select { width: auto; }
  input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }
  input[type=range] { accent-color: var(--accent); width: 110px; }
  .clock { font-size: 15px; font-weight: 700; padding: 5px 12px; border-radius: 7px; background: var(--panel2); border: 1px solid var(--border); }
  .clock.mine { background: #173d2a; border-color: var(--good); color: var(--good); }
  .clock.soon { border-color: var(--warn); color: var(--warn); }
  .nextpicks { color: var(--dim); font-size: 12.5px; }
  .nextpicks b { color: var(--text); }
  main { display: grid; grid-template-columns: 280px 1fr 310px; gap: 14px; padding: 14px 16px; max-width: 1780px; margin: 0 auto; }
  @media (max-width: 1300px) { main { grid-template-columns: 260px 1fr 290px; gap: 10px; padding: 10px 12px; } }
  @media (max-width: 1080px) { main { grid-template-columns: 1fr 310px; } .left-side { grid-column: 1 / -1; } }
  @media (max-width: 768px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .tabs { display: flex; gap: 4px; }
  .tab { border: 1px solid var(--border); background: var(--panel2); color: var(--dim); padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #search { flex: 1; min-width: 140px; background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 10px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 4px 6px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); }
  td { padding: 5px 6px; border-bottom: 1px solid #232a3c; font-size: 13.5px; }
  tr.tierbreak td { border-top: 2px solid var(--accent); }
  .tierlabel { color: var(--accent); font-size: 10.5px; font-weight: 700; text-transform: uppercase; }
  .pname { font-weight: 600; white-space: nowrap; }
  .meta { color: var(--dim); font-size: 11.5px; }
  .pos { display: inline-block; min-width: 34px; text-align: center; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1.5px 5px; color: #10131a; }
  .pos.QB { background: var(--qb); } .pos.RB { background: var(--rb); } .pos.WR { background: var(--wr); } .pos.TE { background: var(--te); }
  .pos.K { background: var(--k); } .pos.DST, .pos.DEF, .pos['D/ST'] { background: var(--dst); }
  .pos.other { background: var(--dim); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .score { font-weight: 700; }
  .rk { color: var(--dim); }
  .valuetag { color: var(--good); font-size: 10.5px; font-weight: 700; }
  tr.takenrow td { opacity: .42; }
  tr.takenrow .pname { text-decoration: line-through; }
  .picktag { font-size: 11px; font-weight: 700; color: var(--dim); white-space: nowrap; }
  .picktag.mine { color: var(--good); }
  .rookietag { color: var(--warn); font-size: 10px; font-weight: 700; border: 1px solid var(--warn); border-radius: 3px; padding: 0 3px; margin-left: 4px; }
  button.act { border: 1px solid var(--border); background: var(--panel2); color: var(--text); border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 12px; font-weight: 600; }
  button.act.mine { border-color: var(--good); color: var(--good); }
  button.act.mine:hover { background: #173d2a; }
  button.act.gone:hover { background: #3d2026; border-color: var(--bad); color: var(--bad); }
  button.act.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.act.primary:hover { opacity: .9; }
  button.small { border: none; background: none; color: var(--dim); cursor: pointer; font-size: 12px; text-decoration: underline; }
  button.small:hover { color: var(--text); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin-bottom: 8px; }
  .side .panel + .panel { margin-top: 14px; }
  .roster-sec-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin: 8px 0 4px; padding-bottom: 2px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; }
  .rosteritem { display: flex; align-items: center; gap: 7px; padding: 3.5px 0; font-size: 13px; }
  .rosteritem.starter-slot { border-left: 2px solid rgba(79, 143, 247, 0.4); padding-left: 4px; }
  .rosteritem.empty-slot { opacity: .45; }
  .rosteritem.bench-slot { border-left: 2px solid rgba(139, 150, 173, 0.25); padding-left: 4px; }
  .slot-label-tag { font-size: 11px; font-weight: 700; color: var(--accent); min-width: 34px; text-align: center; display: inline-block; }
  .slot-label-tag.bench { color: var(--dim); }
  .rosteritem .pk { color: var(--dim); font-size: 11px; min-width: 34px; }
  .rosteritem .bye { margin-left: auto; color: var(--dim); font-size: 11.5px; }
  .bye.clash { color: var(--bad); font-weight: 700; }
  .byetag { display: inline-block; font-size: 11.5px; border-radius: 4px; padding: 1px 5px; line-height: 1.25; text-align: center; }
  .byetag.bye-same-pos { background: rgba(255, 100, 112, 0.18); color: #ff6470; border: 1px solid rgba(255, 100, 112, 0.45); font-weight: 700; }
  .byetag.bye-other-pos { background: rgba(255, 180, 84, 0.14); color: #ffb454; border: 1px solid rgba(255, 180, 84, 0.35); font-weight: 600; }
  .watchbtn { border: none; background: none; cursor: pointer; font-size: 15px; color: var(--dim); padding: 0 4px 0 0; line-height: 1; vertical-align: middle; transition: color 0.15s, transform 0.1s; }
  .watchbtn:hover { color: #f59e0b; transform: scale(1.25); }
  .watchbtn.active { color: #f59e0b; }
  .needs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .need { font-size: 11.5px; padding: 2px 8px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--border); color: var(--dim); }
  .need.short { border-color: var(--warn); color: var(--warn); }
  .need.ok { border-color: var(--good); color: var(--good); }
  .logitem { font-size: 12.5px; padding: 3px 0; color: var(--dim); border-bottom: 1px solid rgba(255,255,255,0.03); }
  .logitem b { color: var(--text); }
  .logitem.mine b { color: var(--good); }
  .warnbox { background: #33261a; border: 1px solid var(--warn); color: var(--warn); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; margin-bottom: 10px; }
  footer { color: var(--dim); font-size: 11.5px; text-align: center; padding: 10px 0 24px; }
  .empty { color: var(--dim); text-align: center; padding: 30px 10px; font-size: 14px; }
  td.clickname { cursor: pointer; }
  td.clickname:hover .pname { text-decoration: underline; color: var(--accent); }
  .rosteritem .pname { cursor: pointer; }
  .rosteritem .pname:hover { text-decoration: underline; color: var(--accent); }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; z-index: 50; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
  #overlay.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: min(620px, 95vw); max-height: 85vh; overflow-y: auto; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .modal h3 { font-size: 18px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .modal .close { margin-left: auto; cursor: pointer; color: var(--dim); font-size: 22px; border: none; background: none; line-height: 1; }
  .modal .close:hover { color: var(--text); }
  .modal h4 { font-size: 12px; text-transform: uppercase; color: var(--dim); margin-top: 14px; letter-spacing: .04em; }
  .statrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .stat { background: var(--panel2); border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; font-size: 12px; color: var(--dim); }
  .stat b { display: block; color: var(--text); font-size: 14px; }
  .blurb { font-size: 13.5px; line-height: 1.5; background: var(--panel2); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 10px; margin: 10px 0 4px; }
  .blurbnote { color: var(--dim); font-size: 11px; margin-top: 4px; }
  .schedgrid { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 4px; }
  .g { font-size: 11px; background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; white-space: nowrap; }
  .g b { color: var(--dim); font-weight: 600; margin-right: 3px; }
  .g.bye { border-color: var(--warn); color: var(--warn); }
  .links { display: flex; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
  .links a { color: var(--accent); font-size: 13px; text-decoration: none; }
  .links a:hover { text-decoration: underline; }

  /* League setup & teams table */
  .setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 12px 0; }
  .setup-field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); }
  .setup-field input, .setup-field select { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  .setup-teams-wrap { max-height: 44vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; margin-top: 10px; padding: 4px; background: #151922; }
  .team-table { width: 100%; border-collapse: separate; border-spacing: 0 4px; }
  .team-table tr { background: var(--panel2); transition: background 0.15s; }
  .team-table tr.is-me { background: #192b23; border: 1px solid var(--good); }
  .team-table td { padding: 5px 8px; border: none; font-size: 13px; vertical-align: middle; }
  .team-table tr td:first-child { border-radius: 6px 0 0 6px; }
  .team-table tr td:last-child { border-radius: 0 6px 6px 0; }
  .slot-badge { font-weight: 700; color: var(--accent); white-space: nowrap; font-size: 12px; }
  .team-input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 5px 8px; font-size: 13px; font-weight: 500; }
  .team-input:focus { border-color: var(--accent); outline: none; }
  .radio-cell { white-space: nowrap; text-align: center; }
  .radio-cell label { cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--dim); }
  .radio-cell input:checked + span { color: var(--good); font-weight: 700; }
  .order-btns { display: flex; gap: 3px; }
  .btn-move { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 4px; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; }
  .btn-move:hover:not(:disabled) { background: var(--border); color: #fff; }
  .btn-move:disabled { opacity: .25; cursor: not-allowed; }
  .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
  .roster-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 6px; }
  .roster-select { flex: 1; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 13px; font-weight: 600; }

  /* Live Sync and Clock Alert Styles */
  .sync-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; margin-left: 5px; vertical-align: middle; }
  .sync-badge.off { background: rgba(139, 150, 173, 0.15); color: var(--dim); border: 1px solid var(--border); }
  .sync-badge.sleeper, .sync-badge.espn, .sync-badge.live { background: rgba(61, 220, 132, 0.18); color: var(--good); border: 1px solid var(--good); }
  .sync-badge.polling { background: rgba(79, 143, 247, 0.18); color: var(--accent); border: 1px solid var(--accent); }
  .dot-pulse { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; animation: pulseDot 1.4s infinite; }
  @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.75); } }

  .clock.mine.pulse-anim { animation: clockPulse 1.2s infinite alternate; }
  @keyframes clockPulse { 0% { box-shadow: 0 0 4px rgba(61,220,132,0.4); border-color: var(--good); } 100% { box-shadow: 0 0 16px rgba(61,220,132,0.95); border-color: #6affaa; } }

  .sync-status-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-top: 14px; font-size: 12.5px; color: var(--dim); line-height: 1.6; }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1 id="leaguetitle">🏈 Ken's Draft Board</h1>
    <span id="clock" class="clock">—</span>
    <span id="nextpicks" class="nextpicks"></span>
    <span style="margin-left:auto"></span>
    <button class="act" id="syncbtn" onclick="openSyncModal()" style="border-color:var(--accent); color:var(--text); font-weight:600">⚡ Live Sync <span id="syncbadge" class="sync-badge off">OFF</span></button>
    <button class="act" id="setupbtn" style="border-color:var(--accent); color:var(--accent); font-weight:700">⚙️ League Setup</button>
    <label class="set">Jump to pick <input type="number" id="jumppick" min="1" style="width:64px"> <button class="act" id="jumpbtn">Go</button></label>
    <button class="small" id="undobtn">↩ Undo last</button>
    <button class="small" id="resetbtn">Reset draft</button>
  </div>
  <div class="hrow">
    <label class="set">My slot <select id="hdrslot"></select></label>
    <label class="set">Teams <b id="hdrteams" style="color:var(--text)">12</b></label>
    <label class="set">Rounds <input type="number" id="rounds" min="1" max="40"></label>
    <label class="set">Order <select id="mode"><option value="3rr">3rd-Round Reversal</option><option value="snake">Normal snake</option></select></label>
    <label class="set">Scoring <select id="hdrscoring"><option value="half">0.5 Half-PPR</option><option value="ppr">Full PPR</option><option value="std">Standard</option></select></label>
    <label class="set">QB Mode <select id="hdrqb"><option value="sf">Superflex (2QB)</option><option value="1qb">1 QB</option></select></label>
    <label class="set"><input type="checkbox" id="teprem"> TE prem</label>
    <label class="set">Win-now <input type="range" id="blend" min="0" max="100" step="5"> Dynasty <span id="blendval" style="color:var(--text)"></span></label>
  </div>
</header>

<main>
  <!-- Left Side: Always shows OUR roster & team composition, plus Watchlist -->
  <aside class="side left-side">
    <div class="panel">
      <div class="roster-header">
        <h2 id="myrosterheader" style="color:var(--good); display:flex; align-items:center; gap:6px; margin:0">
          ⭐ My Roster
        </h2>
      </div>
      <div id="myroster" style="max-height: 38vh; overflow-y: auto;"></div>
      <div class="needs" id="myneeds"></div>
      <div id="mybyewarn"></div>
    </div>
    <div class="panel">
      <div class="roster-header">
        <h2 style="color:var(--warn); display:flex; align-items:center; gap:6px; margin:0">
          ⭐ Watchlist
        </h2>
        <span id="mywatchlistcount" class="meta" style="font-size:12px; font-weight:normal"></span>
      </div>
      <div id="leftwatchlist" style="max-height: 28vh; overflow-y: auto;"></div>
    </div>
  </aside>

  <!-- Center: Player Pool / Draft Board -->
  <section class="panel pool-panel">
    <div id="databanner"></div>
    <div class="toolbar">
      <div class="tabs" id="postabs"></div>
      <input id="search" type="search" placeholder="Search player…">
      <label class="set">Sort <select id="sortsel">
        <option value="score">Draft score</option>
        <option value="dyn">Dynasty rank</option>
        <option value="red">Redraft rank</option>
        <option value="rookie">Rookie / Prospect rank</option>
        <option value="adp">ADP</option>
      </select></label>
      <label class="set"><input type="checkbox" id="hidetaken"> Hide taken</label>
    </div>
    <div style="max-height: 72vh; overflow-y: auto;">
      <table>
        <thead><tr>
          <th>#</th><th>Player</th><th>Pos</th><th>Team</th><th>Bye</th>
          <th class="num" id="th_dyn">Dyn SF</th><th class="num" id="th_red">Redraft</th><th class="num">ADP</th><th class="num">Score</th><th></th>
        </tr></thead>
        <tbody id="pool"></tbody>
      </table>
    </div>
  </section>

  <!-- Right Side: On-Clock Team Roster / League Inspector & Draft Log -->
  <aside class="side right-side">
    <div class="panel">
      <div class="roster-header">
        <select id="rosterTeamSelect" class="roster-select"></select>
        <button class="small" id="onclockquickbtn" style="display:none; white-space:nowrap" onclick="selectRosterSlot(null)">Follow Clock</button>
      </div>
      <div id="clockteamlabel" style="font-size:11.5px; color:var(--dim); margin-bottom:6px"></div>
      <div id="roster" style="max-height: 38vh; overflow-y: auto;"></div>
      <div class="needs" id="needs"></div>
      <div id="byewarn"></div>
    </div>
    <div class="panel">
      <h2>Draft Log</h2>
      <button class="act gone" id="unknownbtn" style="width:100%; margin-bottom:8px">Unlisted pick ➜</button>
      <div id="log" style="max-height: 30vh; overflow-y: auto;"></div>
    </div>
  </aside>
</main>

<footer id="sources"></footer>

<div id="overlay"><div class="modal" id="modalbox"></div></div>

<script src="draft-logic.js?v=20260822"></script>
<script src="players-data.js?v=20260822"></script>
<script>
const STORE_KEY = 'kenDraftBoard-v1';
const DEFAULTS = {
  leagueName: "Ken's Draft Board",
  teams: 12,
  slot: 2,
  rounds: 25,
  mode: '3rr',
  scoring: 'half',
  qbFormat: 'sf',
  teprem: false,
  blend: 60,
  audioChime: true,
  visualPulse: true,
  autoUnlistedSync: true,
  syncRollback: true,
  sleeperDraftId: '',
  sleeperUsername: '',
  teamNames: [
    "Team 1", "Ken", "Team 3", "Team 4", "Team 5", "Team 6",
    "Team 7", "Team 8", "Team 9", "Team 10", "Team 11", "Team 12"
  ],
  rosterSlots: Object.assign({}, DEFAULT_ROSTER_SLOTS)
};

let state = load();
let ui = { posFilter: 'ALL', search: '', sort: 'score', hideTaken: false };
let viewingRosterSlot = null; // null = follow state.settings.slot

function normalizeState(s) {
  s.settings = Object.assign({}, DEFAULTS, s.settings);
  if (!s.settings.leagueName) s.settings.leagueName = "Ken's Draft Board";
  const tCount = Math.max(2, Math.min(32, parseInt(s.settings.teams, 10) || 12));
  s.settings.teams = tCount;
  if (!s.settings.slot || s.settings.slot < 1 || s.settings.slot > tCount) s.settings.slot = 1;

  if (!['ppr', 'half', 'std'].includes(s.settings.scoring)) s.settings.scoring = 'half';
  if (!['sf', '1qb'].includes(s.settings.qbFormat)) s.settings.qbFormat = 'sf';

  if (s.settings.audioChime === undefined) s.settings.audioChime = true;
  if (s.settings.visualPulse === undefined) s.settings.visualPulse = true;
  if (s.settings.autoUnlistedSync === undefined) s.settings.autoUnlistedSync = true;
  if (s.settings.syncRollback === undefined) s.settings.syncRollback = true;
  if (!s.settings.sleeperDraftId) s.settings.sleeperDraftId = '';
  if (!s.settings.sleeperUsername) s.settings.sleeperUsername = '';

  if (!Array.isArray(s.settings.teamNames)) s.settings.teamNames = [];
  const names = [];
  for (let i = 1; i <= tCount; i++) {
    const existing = s.settings.teamNames[i - 1];
    if (existing && String(existing).trim()) {
      names.push(String(existing).trim());
    } else {
      names.push(i === s.settings.slot ? 'My Team' : ('Team ' + i));
    }
  }
  s.settings.teamNames = names;

  s.settings.rosterSlots = Object.assign({}, DEFAULT_ROSTER_SLOTS, s.settings.rosterSlots);
  for (const k of Object.keys(DEFAULT_ROSTER_SLOTS)) {
    s.settings.rosterSlots[k] = Math.max(0, parseInt(s.settings.rosterSlots[k], 10) || 0);
  }
  const startersCount = (s.settings.rosterSlots.qb || 0) + (s.settings.rosterSlots.rb || 0) +
                        (s.settings.rosterSlots.wr || 0) + (s.settings.rosterSlots.te || 0) +
                        (s.settings.rosterSlots.flex || 0) + (s.settings.rosterSlots.superflex || 0) +
                        (s.settings.rosterSlots.k || 0) + (s.settings.rosterSlots.dst || 0);
  const totalRounds = startersCount + (s.settings.rosterSlots.bench || 0);
  if (totalRounds > 0) {
    s.settings.rounds = totalRounds;
  }

  if (!Array.isArray(s.log)) s.log = [];
  if (!Array.isArray(s.watchlist)) s.watchlist = [];
  return s;
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      return normalizeState(s);
    }
  } catch (e) { /* fallback on error */ }
  return normalizeState({ settings: Object.assign({}, DEFAULTS), log: [], watchlist: [] });
}

function save() {
  normalizeState(state);
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

  state.log.push({
    overall: pick,
    playerId: null,
    customName: nameVal,
    customPos: posVal,
    customTeam: (team && team.trim()) ? team.trim().toUpperCase() : null,
    customBye: (bye && bye >= 1 && bye <= 18) ? bye : null,

  reportServerPick({

    name: nameVal,

function undo() {

  const removed = state.log.pop();

  reportServerEvent('↩️ Undid pick #' + (removed.overall || (state.log.length + 1)) + ' (Now at Pick #' + (state.log.length + 1) + ')', 'info');
}
function jumpTo(pick) {
  pick = Math.max(1, Math.floor(pick));
  while (state.log.length > pick - 1) state.log.pop();
  while (state.log.length < pick - 1) {
    state.log.push({ overall: state.log.length + 1, playerId: null, customName: 'Skipped pick', customPos: 'OTHER', mine: false });
  }
  const taken = takenMap();
  state.watchlist = cleanWatchlist(state.watchlist, taken);
  save(); render();
}

function fmtPick(overall, teams) {

// ---------- Audio & Visual Cues ----------
let audioCtx = null;
let lastOnClockPickNotified = null;

function getAudioContext() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }
  return audioCtx;
}

function playPickChime() {
  if (!state.settings.audioChime) return;
  try {
    const ctx = getAudioContext();
    if (!ctx) return;
    const now = ctx.currentTime;
    // Ascending major triad chime (F5 -> A5 -> C6)
    const notes = [
      { freq: 698.46, start: 0, dur: 0.14 },
      { freq: 880.00, start: 0.11, dur: 0.16 },
      { freq: 1046.50, start: 0.22, dur: 0.38 }
    ];
    notes.forEach(n => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(n.freq, now + n.start);

      gain.gain.setValueAtTime(0, now + n.start);
      gain.gain.linearRampToValueAtTime(0.22, now + n.start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + n.start + n.dur);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now + n.start);
      osc.stop(now + n.start + n.dur);
    });
  } catch (e) {
    console.warn('Audio chime error:', e);
  }
}

  }

  const clock = $('clock');
  if (pick > totalPicks) {

  } else {

    if (isMe) {
      clock.className = 'clock mine' + (s.visualPulse ? ' pulse-anim' : '');

        playPickChime();
      }
    } else {
      lastOnClockPickNotified = null;
      const myPicks = picksForSlot(s.slot, s.teams, s.rounds, s.mode).filter(p => p >= pick);
      if (myPicks.length && myPicks[0] - pick <= 3) {
        clock.className = 'clock soon';

      : 'No picks left';

function scored() {
  const s = state.settings;
  const blend = s.blend / 100;
  return PLAYERS.map(p => {
    const dynRank = getDynastyRank(p, s.qbFormat);
    const redRank = getRedraftRank(p, s.qbFormat, s.scoring);
    const prospectRank = getProspectRank(p, s.qbFormat, s.scoring);
    const score = computeFormatScore(p, {
      blend: blend,
      qbFormat: s.qbFormat,
      scoring: s.scoring,
      tePremium: s.teprem,
      depth: 250
    });
    return Object.assign({
      activeDyn: dynRank,
      activeRed: redRank,
      prospectRank: prospectRank,
      score: score
    }, p);
  });
}

function renderPool() {
  const s = state.settings;
  const taken = takenMap();
  const pickOf = new Map();
  for (const e of state.log) if (e.playerId != null) pickOf.set(e.playerId, e);
  const q = normalizeName(ui.search || '');
  let rows = scored();
  if (ui.hideTaken) rows = rows.filter(p => !taken.has(p.id));
  if (ui.posFilter === 'WATCHLIST') rows = rows.filter(p => isWatched(state.watchlist, p.id));
  else if (ui.posFilter === 'ROOKIE') rows = rows.filter(p => p.rookie);
  else if (ui.posFilter === 'DST') rows = rows.filter(p => ['DST', 'DEF', 'D/ST'].includes((p.pos || '').toUpperCase()));
  else if (ui.posFilter !== 'ALL') rows = rows.filter(p => (p.pos || '').toUpperCase() === ui.posFilter);

  if (q) {
    const qDst = resolveDstCanonical(q);
    rows = rows.filter(p => {
      if (qDst && p.pos === 'DST' && p.team === qDst.team) return true;
      if (normalizeName(p.name).includes(q)) return true;
      if (p.team && normalizeName(p.team) === q) return true;
      return false;
    });
  }

  // Dynamic table headers
  if ($('th_dyn')) $('th_dyn').textContent = (s.qbFormat === '1qb') ? 'Dyn 1QB' : 'Dyn SF';
  if ($('th_red')) {
    const scTag = s.scoring === 'ppr' ? 'PPR' : (s.scoring === 'std' ? 'STD' : 'Half');
    $('th_red').textContent = 'Red (' + (s.qbFormat === '1qb' ? scTag : 'SF ' + scTag) + ')';
  }

  const key = {
    score: p => -(p.score ?? -1),
    dyn: p => p.activeDyn ?? 9999,
    red: p => p.activeRed ?? 9999,
    rookie: p => (p.rookie ? (p.prospectRank ?? p.activeDyn ?? 999) : 9999),
    adp: p => p.adp ?? 9999
  }[ui.sort] || (p => -(p.score ?? -1));

  rows.sort((a, b) => key(a) - key(b));

  const pick = currentPick();
  const onClock = teamForOverall(pick, state.settings.teams, state.settings.mode, state.settings.teamNames, state.settings.slot);
  const isOurPick = onClock.isMe;
  const myRoster = getMyRosterPlayers(state.log, byId, state.settings.slot, state.settings.teams, state.settings.mode);
  const showTiers = ui.sort === 'score' && !q && ui.posFilter !== 'ROOKIE' && ui.posFilter !== 'WATCHLIST';
  let html = '', prevScore = null, tier = 1;
  rows.slice(0, 250).forEach((p, idx) => {
    const isTaken = taken.has(p.id);
    let tierRow = '';
    if (showTiers && prevScore != null && p.score != null && prevScore - p.score > 4) {
      tier++;
      tierRow = ' tierbreak';
    }
    if (p.score != null) prevScore = p.score;
    const posClass = ['QB','RB','WR','TE'].includes(p.pos) ? p.pos : 'other';
    const value = !isTaken && p.adp && p.adp - pick >= 8 ? ' <span class="valuetag">▼' + Math.round(p.adp - pick) + ' vs ADP</span>' : '';
    const rookieRankStr = p.rookieRank ? ' #' + p.rookieRank : '';
    const rookie = p.rookie ? '<span class="rookietag" title="Rookie Draft Rank' + rookieRankStr + '">R' + rookieRankStr + '</span>' : '';
    const age = p.age ? ' <span class="meta">' + p.age + 'y</span>' : '';
    const watched = isWatched(state.watchlist, p.id);
    const starBtn = !isTaken
      ? '<button type="button" class="watchbtn' + (watched ? ' active' : '') + '" title="' + (watched ? 'Remove from Watchlist' : 'Add to Watchlist') + '" onclick="toggleWatch(' + p.id + ', event)">' + (watched ? '★' : '☆') + '</button>'
      : '';

    let actionCell = '';
    if (isTaken) {
      const pickEntry = pickOf.get(p.id);
      const tInfo = teamForOverall(pickEntry.overall, state.settings.teams, state.settings.mode, state.settings.teamNames, state.settings.slot);
      const isMine = taken.get(p.id) === 'me' || tInfo.isMe;
      actionCell = '<td><span class="picktag' + (isMine ? ' mine' : '') + '">'
        + (isMine ? '✅ ' : '') + tInfo.name + ' · '
        + fmtPick(pickEntry.overall, state.settings.teams) + ' (#' + pickEntry.overall + ')</span></td>';
    } else {
      if (isOurPick) {
        actionCell = '<td style="white-space:nowrap"><button class="act mine" title="Draft ' + p.name.replace(/"/g, '&quot;') + ' for our team" onclick="draftPlayer(' + p.id + ',true)">Select our Player</button></td>';
      } else {
        actionCell = '<td style="white-space:nowrap"><button class="act" title="Record pick for ' + onClock.name.replace(/"/g, '&quot;') + '" onclick="draftPlayer(' + p.id + ',false)">Pick Player</button></td>';
      }
    }

    let byeCell = '<td class="meta">' + (p.bye || '—') + '</td>';
    if (p.bye) {
      const byeClash = getByeClashStatus(p, myRoster);
      if (byeClash.type === 'same-pos') {
        const names = byeClash.samePos.map(x => x.name).join(', ');
        const tip = 'Same-position bye clash with ' + names + ' (' + p.pos + ', Week ' + p.bye + ')';
        byeCell = '<td><span class="byetag bye-same-pos" title="' + tip.replace(/"/g, '&quot;') + '">⚠️ ' + p.bye + '</span></td>';
      } else if (byeClash.type === 'other-pos') {
        const names = byeClash.otherPos.map(x => x.name + ' (' + x.pos + ')').join(', ');
        const tip = 'Bye week coincides with ' + names + ' (Week ' + p.bye + ')';
        byeCell = '<td><span class="byetag bye-other-pos" title="' + tip.replace(/"/g, '&quot;') + '">' + p.bye + '</span></td>';
      }
    }

    html += '<tr class="' + tierRow + (isTaken ? ' takenrow' : '') + '">'
      + '<td class="rk">' + (idx + 1) + (tierRow ? ' <span class="tierlabel">T' + tier + '</span>' : '') + '</td>'
      + '<td class="clickname" onclick="showPlayer(' + p.id + ')">' + starBtn + '<span class="pname">' + p.name + '</span>' + rookie + age + value + '</td>'
      + '<td><span class="pos ' + posClass + '">' + p.pos + '</span></td>'
      + '<td class="meta">' + (p.team || '—') + '</td>'
      + byeCell
      + '<td class="num rk">' + (p.activeDyn ?? '—') + '</td>'
      + '<td class="num rk">' + (p.activeRed ?? '—') + '</td>'
      + '<td class="num rk">' + (p.adp ? p.adp.toFixed(0) : '—') + '</td>'
      + '<td class="num score">' + (p.score != null ? p.score.toFixed(1) : '—') + '</td>'
      + actionCell
      + '</tr>';
  });
  let emptyMsg = PLAYERS.length ? 'No players match.' : 'Player data not loaded yet.';
  if (ui.posFilter === 'WATCHLIST' && PLAYERS.length) {
    emptyMsg = 'Your watchlist is empty. Click the ☆ star on any player to add them to your watchlist.';
  }
  $('pool').innerHTML = html || '<tr><td colspan="10" class="empty">' + emptyMsg + '</td></tr>';
}

function renderRosterSection(resolvedPicks, rosterSlots, teamsCount) {
  const playersWithEntry = resolvedPicks.map(x => Object.assign({ entry: x.entry }, x.player));
  const allocation = assignRosterSlots(playersWithEntry, rosterSlots);

  const byBye = {};
  for (const { player } of resolvedPicks) {
    if (player.bye) {
      (byBye[player.bye] = byBye[player.bye] || []).push(player.name);
    }
  }

  const formatSlot = (item, isStarter) => formatRosterSlotHtml(item, isStarter, teamsCount, byBye);

  const filledStartersCount = allocation.starters.filter(s => s.player !== null).length;
  let html = '<div class="roster-sec-title"><span>Starters</span><span>' + filledStartersCount + ' / ' + allocation.totalStarters + '</span></div>';
  html += allocation.starters.map(s => formatSlot(s, true)).join('');

  html += '<div class="roster-sec-title" style="margin-top:10px"><span>Bench</span><span>' + allocation.bench.length + ' / ' + allocation.totalBench + '</span></div>';
  if (allocation.bench.length > 0) {
    html += allocation.bench.map(b => formatSlot(b, false)).join('');
  } else {
    html += '<div class="meta" style="font-size:11.5px; padding:3px 0">No bench players yet.</div>';
  }

  // Positional requirements & needs calculation
  const reqs = {
    QB: (rosterSlots.qb || 0) + (rosterSlots.superflex ? 1 : 0),
    RB: (rosterSlots.rb || 0) + (rosterSlots.flex ? 1 : 0),
    WR: (rosterSlots.wr || 0) + (rosterSlots.flex ? 1 : 0),
    TE: (rosterSlots.te || 0) + (rosterSlots.flex ? 1 : 0),
    K: (rosterSlots.k || 0),
    DST: (rosterSlots.dst || 0)
  };

  const needsList = [];
  for (const pos of ['QB', 'RB', 'WR', 'TE', 'K', 'DST']) {
    const target = reqs[pos];
    if (target > 0 || (allocation.counts[pos] && allocation.counts[pos] > 0)) {
      const c = allocation.counts[pos] || 0;
      const cls = c >= target ? 'ok' : (resolvedPicks.length >= 6 && c === 0 ? 'short' : '');
      needsList.push('<span class="need ' + cls + '">' + (pos === 'DST' ? 'D/ST' : pos) + ' ' + c + '/' + target + '+</span>');
    }
  }

  const clashWeeks = Object.keys(byBye).filter(w => byBye[w].length >= 2);
  const byeWarnHtml = clashWeeks.length
    ? '<div class="warnbox" style="margin-top:10px">Bye overlap — week ' + clashWeeks.map(w => w + ': ' + byBye[w].join(', ')).join(' · week ') + '</div>'
    : '';

  return {
    rosterHtml: html,
    needsHtml: needsList.join('') + '<span class="need">Lineup: ' + formatLineupSummary(rosterSlots) + '</span>',
    byeWarnHtml: byeWarnHtml
  };
}

function renderMyRoster() {
  const s = state.settings;
  const targetSlot = s.slot;
  const myTeamName = getTeamName(targetSlot);
  const myPicks = state.log.filter(e => slotForOverall(e.overall, s.teams, s.mode).slot === targetSlot);

  $('myrosterheader').innerHTML = '⭐ ' + myTeamName + ' <span class="meta" style="font-size:12px; margin-left:auto; font-weight:normal">Slot ' + targetSlot + ' · ' + myPicks.length + ' picks</span>';

  const resolvedPicks = myPicks.map(e => ({
    entry: e,
    player: resolvePickPlayer(e, byId)
  }));

  const res = renderRosterSection(resolvedPicks, s.rosterSlots, s.teams);
  $('myroster').innerHTML = res.rosterHtml;
  $('myneeds').innerHTML = res.needsHtml;
  $('mybyewarn').innerHTML = res.byeWarnHtml;
}

function renderInspectRoster() {
  const s = state.settings;
  const pick = currentPick();
  const onClockTeam = teamForOverall(pick, s.teams, s.mode, s.teamNames, s.slot);
  const targetSlot = (viewingRosterSlot != null) ? viewingRosterSlot : onClockTeam.slot;
  const isFollowingClock = (viewingRosterSlot == null || viewingRosterSlot === onClockTeam.slot);
  const isTargetMine = (targetSlot === s.slot);

  // Populate Dropdown
  let selectHtml = '<option value="clock"' + (viewingRosterSlot == null ? ' selected' : '') + '>⚡ [Auto: On The Clock — ' + onClockTeam.name + ' (Slot ' + onClockTeam.slot + ')]</option>';
  for (let i = 1; i <= s.teams; i++) {
    const isClock = (i === onClockTeam.slot);
    const isMe = (i === s.slot);
    const isSelected = (viewingRosterSlot === i);
    const count = state.log.filter(e => slotForOverall(e.overall, s.teams, s.mode).slot === i).length;
    selectHtml += '<option value="' + i + '"' + (isSelected ? ' selected' : '') + '>'
      + (isClock ? '🕒 ' : (isMe ? '⭐ ' : '')) + getTeamName(i) + ' (Slot ' + i + ' · ' + count + ' picks)' + (isMe ? ' [You]' : '')
      + '</option>';
  }
  $('rosterTeamSelect').innerHTML = selectHtml;
  $('onclockquickbtn').style.display = (viewingRosterSlot != null && viewingRosterSlot !== onClockTeam.slot) ? 'inline-block' : 'none';

  // Label
  if (isFollowingClock) {
    $('clockteamlabel').innerHTML = '🕒 <b style="color:var(--accent)">On The Clock:</b> <span style="color:var(--text); font-weight:600">' + onClockTeam.name + '</span>' + (onClockTeam.isMe ? ' <span style="color:var(--good); font-weight:700">(Your Turn!)</span>' : ' (Slot ' + onClockTeam.slot + ')');
  } else {
    $('clockteamlabel').innerHTML = '👥 <b style="color:var(--dim)">Inspecting:</b> <span style="color:var(--text); font-weight:600">' + getTeamName(targetSlot) + '</span> (Slot ' + targetSlot + ') · <a href="javascript:void(0)" onclick="selectRosterSlot(null)" style="color:var(--accent); text-decoration:underline">Back to On-Clock</a>';
  }

  // Filter all picks belonging to target slot
  const teamPicks = state.log.filter(e => slotForOverall(e.overall, s.teams, s.mode).slot === targetSlot);
  const resolvedPicks = teamPicks.map(e => ({
    entry: e,
    player: resolvePickPlayer(e, byId)
  }));

  const res = renderRosterSection(resolvedPicks, s.rosterSlots, s.teams);
  $('roster').innerHTML = res.rosterHtml;
  $('needs').innerHTML = res.needsHtml;
  $('byewarn').innerHTML = res.byeWarnHtml;
}

function renderLog() {
  const s = state.settings;
  $('log').innerHTML = state.log.slice().reverse().map(e => {
    const p = resolvePickPlayer(e, byId);
    const posTeam = (p.pos || (p.team && p.team !== '—'))
      ? ' <span class="meta">(' + p.pos + (p.team && p.team !== '—' ? ' · ' + p.team : '') + ')</span>'
      : '';
    const tInfo = teamForOverall(e.overall, s.teams, s.mode, s.teamNames, s.slot);
    const isMe = e.mine || tInfo.isMe;
    const unlistedBadge = p.isUnlisted ? ' <span class="meta" style="font-size:10px">(unlisted)</span>' : '';
    return '<div class="logitem' + (isMe ? ' mine' : '') + '">'
      + '<span class="meta">#' + e.overall + ' (' + fmtPick(e.overall, s.teams) + ')</span> '
      + '<b style="color:' + (isMe ? 'var(--good)' : 'var(--text)') + '">' + tInfo.name + (isMe ? ' (You)' : '') + '</b>: '
      + p.name + posTeam + unlistedBadge + (isMe ? ' ✅' : '') + '</div>';

}

// ---------- Player detail popup ----------
function showPlayer(id) {
  const p = byId(id);
  if (!p) return;
  const s = state.settings;
  const activeDyn = getDynastyRank(p, s.qbFormat);
  const activeRed = getRedraftRank(p, s.qbFormat, s.scoring);
  const activeScore = computeFormatScore(p, {
    blend: s.blend / 100,
    qbFormat: s.qbFormat,
    scoring: s.scoring,
    tePremium: s.teprem,
    depth: 250
  });

  const taken = takenMap();
  const posClass = ['QB','RB','WR','TE'].includes(p.pos) ? p.pos : 'other';

  let status = '';
  if (taken.has(id)) {
    const pickEntry = state.log.find(e => e.playerId === id);
    if (pickEntry) {
      const tInfo = teamForOverall(pickEntry.overall, state.settings.teams, state.settings.mode, state.settings.teamNames, state.settings.slot);
      const isMine = taken.get(id) === 'me' || tInfo.isMe;
      status = isMine
        ? '<span class="picktag mine">✅ On your team (Pick #' + pickEntry.overall + ', ' + fmtPick(pickEntry.overall, state.settings.teams) + ')</span>'
        : '<span class="picktag">Drafted by ' + tInfo.name + ' (Pick #' + pickEntry.overall + ', ' + fmtPick(pickEntry.overall, state.settings.teams) + ')</span>';
    } else {
      status = '<span class="picktag">Taken</span>';
    }
  }

  const stats = [
    ['Active Mode (' + (s.qbFormat === '1qb' ? '1QB' : 'SF') + ' ' + s.scoring.toUpperCase() + ')', activeScore != null ? activeScore.toFixed(1) + ' pts' : null],
    ['Dynasty ' + (s.qbFormat === '1qb' ? '1QB' : 'SF'), activeDyn],
    ['Redraft (' + s.scoring.toUpperCase() + ')', activeRed],
    ['Dyn SF', p.dynSF], ['Dyn 1QB', p.dyn1QB],
    ['1QB PPR', p.red_1qb_ppr], ['1QB Half', p.red_1qb_half], ['1QB Std', p.red_1qb_std],
    ['SF PPR', p.red_sf_ppr], ['SF Half', p.red_sf_half], ['SF Std', p.red_sf_std],
    ['Rookie Draft Rank', p.rookieRank ? '#' + p.rookieRank : (p.rookie ? 'Rookie' : null)],
    ['ADP', p.adp ? p.adp.toFixed(0) : null], ['Age', p.age ? p.age + 'y' : null], ['Bye', p.bye ? 'Wk ' + p.bye : null],
    ['ESPN', p.espn_ppr || p.espn_std], ['Yahoo', p.yahoo], ['Boris Chen', p.boris_half || p.boris_ppr || p.boris_std]
  ].filter(x => x[1] != null)
   .map(x => '<span class="stat">' + x[0] + '<b>' + x[1] + '</b></span>').join('');
  const snapDate = window.DRAFT_DATA.extrasGenerated || window.DRAFT_DATA.generated || '';
  const blurb = p.blurb
    ? '<div class="blurb">' + p.blurb + '</div><div class="blurbnote">News snapshot from ' + snapDate + ' — use the links below for anything newer.</div>'
    : '<div class="blurbnote">No baked-in news for this player — use the live links below.</div>';
  const sched = (window.DRAFT_DATA.schedules || {})[p.team];
  const schedHtml = sched
    ? '<h4>2026 Schedule</h4><div class="schedgrid">' + sched.map((opp, i) =>
        '<span class="g' + (opp === 'BYE' ? ' bye' : '') + '"><b>' + (i + 1) + '</b>' + opp + '</span>').join('') + '</div>'
    : (p.team && p.team !== 'FA' ? '<div class="blurbnote">Schedule data still loading — check back shortly.</div>' : '');
  const q = encodeURIComponent(p.name + (p.team && p.team !== 'FA' ? ' ' + p.team : '') + ' fantasy');
  const links = '<div class="links">'
    + '<a target="_blank" href="https://news.google.com/search?q=' + q + '">🔎 Google News</a>'
    + '<a target="_blank" href="https://www.espn.com/search/_/q/' + encodeURIComponent(p.name) + '">ESPN</a>'
    + '<a target="_blank" href="https://www.google.com/search?q=' + encodeURIComponent(p.name) + '+site%3Afantasypros.com">FantasyPros</a>'
    + '</div>';

  const myRoster = getMyRosterPlayers(state.log, byId, state.settings.slot, state.settings.teams, state.settings.mode);
  const byeClash = getByeClashStatus(p, myRoster);
  let byeAlert = '';
  if (byeClash.type === 'same-pos') {
    const names = byeClash.samePos.map(x => x.name).join(', ');
    byeAlert = '<div class="warnbox" style="margin-top:10px; background:#3d2026; border-color:var(--bad); color:var(--bad)">⚠️ <b>Same-Position Bye Clash:</b> Shares Week ' + p.bye + ' bye with your ' + p.pos + ' (' + names + ')</div>';
  } else if (byeClash.type === 'other-pos') {
    const names = byeClash.otherPos.map(x => x.name + ' (' + x.pos + ')').join(', ');
    byeAlert = '<div style="margin-top:10px; padding:8px 10px; background:#33261a; border:1px solid var(--warn); color:var(--warn); border-radius:8px; font-size:12.5px">⚡ <b>Roster Bye Overlap:</b> Shares Week ' + p.bye + ' bye with ' + names + '</div>';
  }

  const watched = isWatched(state.watchlist, p.id);
  const watchModalBtn = !taken.has(id)
    ? '<button type="button" class="act' + (watched ? ' primary' : '') + '" onclick="toggleWatch(' + p.id + '); showPlayer(' + p.id + ');" style="margin-left:auto; font-size:12px">' + (watched ? '★ In Watchlist' : '☆ Add to Watchlist') + '</button>'
    : '';

  $('modalbox').innerHTML =
    '<h3><span class="pos ' + posClass + '">' + p.pos + '</span>' + p.name
    + (p.rookie ? '<span class="rookietag">R</span>' : '')
    + ' <span class="meta">' + (p.team || '') + '</span>' + status
    + watchModalBtn
    + '<button class="close" onclick="closeModal()">×</button></h3>'
    + '<div class="statrow">' + stats + '</div>'
    + byeAlert + blurb + schedHtml + links;
  $('overlay').classList.add('show');
}

  $('overlay').classList.add('show');

  function updateRosterMath(fromRounds) {
    const qb = Math.max(0, parseInt($('setup_roster_qb').value, 10) || 0);
    const rb = Math.max(0, parseInt($('setup_roster_rb').value, 10) || 0);
    const wr = Math.max(0, parseInt($('setup_roster_wr').value, 10) || 0);
    const te = Math.max(0, parseInt($('setup_roster_te').value, 10) || 0);
    const flex = Math.max(0, parseInt($('setup_roster_flex').value, 10) || 0);
    const sf = Math.max(0, parseInt($('setup_roster_superflex').value, 10) || 0);
    const k = Math.max(0, parseInt($('setup_roster_k').value, 10) || 0);
    const dst = Math.max(0, parseInt($('setup_roster_dst').value, 10) || 0);
    const starters = qb + rb + wr + te + flex + sf + k + dst;

    if (fromRounds) {
      const rounds = Math.max(1, parseInt($('setup_rounds_count').value, 10) || 1);
      const bench = Math.max(0, rounds - starters);
      $('setup_roster_bench').value = bench;
    } else {

function syncSetupInputsFromDom() {

function changeSetupMySlot(slot) {
  syncSetupInputsFromDom();
  setupMySlot = slot;
  const count = Math.max(2, Math.min(32, parseInt($('setup_team_count').value, 10) || 12));
  for (let i = 1; i <= count; i++) {
    const row = $('setup_row_' + i);

}

function moveSetupTeam(slot, delta) {
  syncSetupInputsFromDom();
  const count = Math.max(2, Math.min(32, parseInt($('setup_team_count').value, 10) || 12));
  const targetSlot = slot + delta;
  if (targetSlot < 1 || targetSlot > count) return;

  // Swap names
  const tempName = setupDraftNames[slot - 1];
  setupDraftNames[slot - 1] = setupDraftNames[targetSlot - 1];
  setupDraftNames[targetSlot - 1] = tempName;

  // Update mySlot if one of the swapped was my slot
  if (setupMySlot === slot) setupMySlot = targetSlot;
  else if (setupMySlot === targetSlot) setupMySlot = slot;

  // Re-render table
  const countVal = Math.max(2, Math.min(32, parseInt($('setup_team_count').value, 10) || 12));
  $('setup_teams_body').innerHTML = (function() {
    let rows = '';
    for (let i = 1; i <= countVal; i++) {
      const name = setupDraftNames[i - 1] || ('Team ' + i);
      const isMe = (i === setupMySlot);
      rows += '<tr class="' + (isMe ? 'is-me' : '') + '" id="setup_row_' + i + '">'
        + '<td class="slot-label"><span class="slot-badge">Slot ' + i + '</span></td>'
        + '<td><input type="text" class="team-input" id="team_input_' + i + '" data-slot="' + i + '" value="' + name.replace(/"/g, '&quot;') + '" placeholder="Team ' + i + ' name"></td>'
        + '<td class="radio-cell"><label><input type="radio" name="setup_my_slot" value="' + i + '"' + (isMe ? ' checked' : '') + ' onchange="changeSetupMySlot(' + i + ')"> <span>My Team</span></label></td>'
        + '<td><div class="order-btns">'
        + '<button type="button" class="btn-move" title="Move Up" onclick="moveSetupTeam(' + i + ', -1)"' + (i === 1 ? ' disabled' : '') + '>▲</button>'
        + '<button type="button" class="btn-move" title="Move Down" onclick="moveSetupTeam(' + i + ', 1)"' + (i === countVal ? ' disabled' : '') + '>▼</button>'
        + '</div></td>'
        + '</tr>';
    }
    return rows;
  })();
}

function resetSetupDefaults() {
  const count = Math.max(2, Math.min(32, parseInt($('setup_team_count').value, 10) || 12));
  setupDraftNames = [];
  for (let i = 1; i <= count; i++) {

// ---------- Live Draft Sync Controller (Sleeper & ESPN) ----------
const SYNC_CHANNEL_NAME = 'fantasy_drafter_sync';
let syncState = {
  type: 'off', // 'off' | 'sleeper' | 'espn'
  sleeperTimer: null,
  sleeperStatus: 'Disconnected',
  sleeperLastPoll: null,
  sleeperPicksCount: 0,
  espnConnected: false,
  espnLastSeen: null,
  channel: null,
  activeTab: 'sleeper'
};

let serverRelaySource = null;
let serverPollTimer = null;
let lastSyncTimestamp = 0;

function reportServerPick(data) {
  const host = window.location.origin.startsWith('http') ? window.location.origin : 'http://127.0.0.1:8517';
  try {
    fetch(host + '/api/sync/pick', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
      mode: 'cors'
    }).catch(() => {});
  } catch (e) {}
}

function reportServerEvent(message, type) {
  const host = window.location.origin.startsWith('http') ? window.location.origin : 'http://127.0.0.1:8517';
  try {
    fetch(host + '/api/sync/log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: message, type: type || 'info' }),
      mode: 'cors'
    }).catch(() => {});
  } catch (e) {}
}

function initBroadcastSync() {
  // 1. Cross-Origin Local HTTP Relay (SSE & Polling)
  initServerSyncRelay();

  // 2. Window postMessage Listener (in case opened via window.opener)
  window.addEventListener('message', function(e) {
    if (e.data && typeof e.data === 'object' && e.data.source === 'espn') {
      handleIncomingSyncEvent(e.data);
    }
  });

  // 3. BroadcastChannel (same-origin fallback)
  if (typeof BroadcastChannel !== 'undefined') {
    try {
      if (syncState.channel) syncState.channel.close();
      syncState.channel = new BroadcastChannel(SYNC_CHANNEL_NAME);
      syncState.channel.onmessage = function(e) {
        if (!e.data) return;
        handleIncomingSyncEvent(e.data);
      };
      syncState.channel.postMessage({ type: 'PING', source: 'drafter' });
    } catch (err) {
      console.warn('BroadcastChannel error:', err);
    }
  }
}

function startFallbackPolling() {
  if (!serverPollTimer) {
    serverPollTimer = setInterval(pollServerSync, 3000);
    pollServerSync();
  }
}

function stopFallbackPolling() {
  if (serverPollTimer) {
    clearInterval(serverPollTimer);
    serverPollTimer = null;
  }
}

function initServerSyncRelay() {
  const host = window.location.origin.startsWith('http') ? window.location.origin : 'http://127.0.0.1:8517';
  
  // Try Server-Sent Events (SSE) as primary zero-poll real-time channel
  try {
    if (serverRelaySource) {
      serverRelaySource.close();
      serverRelaySource = null;
    }
    serverRelaySource = new EventSource(host + '/api/sync/events');
    
    serverRelaySource.onopen = function() {
      // SSE connected! Shut down any fallback polling timer
      stopFallbackPolling();
    };

    serverRelaySource.onmessage = function(e) {
      if (!e.data) return;
      stopFallbackPolling();
      try {
        const data = JSON.parse(e.data);
        handleIncomingSyncEvent(data);
      } catch (err) {}
    };

    serverRelaySource.onerror = function() {
      // SSE disconnected or unavailable: activate fallback polling
      startFallbackPolling();
    };
  } catch (e) {
    startFallbackPolling();
  }
}

async function pollServerSync() {
  const host = window.location.origin.startsWith('http') ? window.location.origin : 'http://127.0.0.1:8517';
  try {
    const res = await fetch(host + '/api/sync/poll?since=' + lastSyncTimestamp, { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    if (data.serverTime) lastSyncTimestamp = data.serverTime;
    
    if (data.espnConnected) {
      syncState.espnConnected = true;
      syncState.espnLastSeen = data.lastSeen || Date.now();
      if (syncState.type !== 'sleeper') {
        syncState.type = 'espn';
      }
      updateSyncBadge();
      updateEspnStatusBox();
    } else {
      if (syncState.type === 'espn' && (Date.now() - (syncState.espnLastSeen || 0) > 30000)) {
        syncState.espnConnected = false;
        syncState.type = 'off';
        updateSyncBadge();
        updateEspnStatusBox();
      }
    }

    if (Array.isArray(data.picks)) {
      for (const p of data.picks) {
        handleRemotePickEvent(p);
      }
    }
  } catch (err) {
    // Server might be running on file:// without local backend or offline
  }
}

function handleIncomingSyncEvent(data) {
  if (!data) return;
  if (data.type === 'SYNC_CONNECTED' || data.type === 'PONG' || data.type === 'SYNC_STATUS') {
    if (data.espnConnected !== false) {
      syncState.espnConnected = true;
      syncState.espnLastSeen = data.timestamp || data.lastSeen || Date.now();
      if (syncState.type !== 'sleeper') {
        syncState.type = 'espn';
      }
      updateSyncBadge();
      updateEspnStatusBox();
    }
  } else if (data.type === 'PICK_MADE') {
    syncState.espnConnected = true;
    syncState.espnLastSeen = data.timestamp || Date.now();
    if (syncState.type !== 'sleeper') {
      syncState.type = 'espn';
    }
    updateSyncBadge();
    updateEspnStatusBox();
    handleRemotePickEvent(data);
  }
}

function handleRemotePickEvent(pickData) {
  const overall = pickData.overall || currentPick();
  const existingIdx = state.log.findIndex(e => e.overall === overall);

  const resolved = resolveRemotePick(pickData, PLAYERS, { unlistedFallback: state.settings.autoUnlistedSync !== false });
  if (!resolved) return;

  const slotInfo = teamForOverall(overall, state.settings.teams, state.settings.mode, state.settings.teamNames, state.settings.slot);
  const isMine = slotInfo.isMe;

  const entry = {
    overall: overall,
    playerId: resolved.playerId,
    customName: resolved.customName || null,
    customPos: resolved.customPos || null,
    customTeam: resolved.customTeam || null,
    customBye: resolved.customBye || null,
    mine: isMine
  };

  if (existingIdx >= 0) {
    state.log[existingIdx] = entry;
  } else {
    state.log.push(entry);
  }

  // Guarantee chronological ascending pick order
  state.log.sort((a, b) => a.overall - b.overall);

  if (resolved.playerId != null) {
    state.watchlist = cleanWatchlist(state.watchlist, [resolved.playerId]);
  }

  save();
  render();
}

function updateSyncBadge() {
  const badge = $('syncbadge');
  if (!badge) return;

  if (syncState.type === 'sleeper' && syncState.sleeperTimer) {
    badge.className = 'sync-badge sleeper';
    badge.innerHTML = '<span class="dot-pulse"></span> Sleeper (#' + state.log.length + ')';
  } else if (syncState.type === 'espn' && syncState.espnConnected) {
    badge.className = 'sync-badge espn';
    badge.innerHTML = '<span class="dot-pulse"></span> ESPN Live';
  } else if (syncState.type === 'sleeper') {
    badge.className = 'sync-badge polling';
    badge.innerHTML = 'Sleeper (Paused)';
  } else {
    badge.className = 'sync-badge off';
    badge.innerHTML = 'OFF';
  }
}

function extractSleeperDraftId(input) {
  if (!input) return '';
  const str = String(input).trim();
  const urlMatch = str.match(/drafts?(?:\/nfl)?\/([a-zA-Z0-9_-]+)/i);
  if (urlMatch && urlMatch[1]) return urlMatch[1];
  return str;
}

async function importSleeperLeague() {
  const draftIdInput = $('sync_sleeper_draft_id');
  const userInput = $('sync_sleeper_username');
  const rawId = draftIdInput ? draftIdInput.value : state.settings.sleeperDraftId;
  const draftId = extractSleeperDraftId(rawId);
  const username = userInput ? userInput.value.trim() : state.settings.sleeperUsername;

  if (!draftId) {
    alert('Please enter a Sleeper Draft ID or League URL.');
    return;
  }

  state.settings.sleeperDraftId = draftId;
  state.settings.sleeperUsername = username;
  save();

  const statusEl = $('sleeper_import_msg');
  if (statusEl) statusEl.innerHTML = '<span style="color:var(--accent)">⏳ Fetching draft from Sleeper API...</span>';

  try {
    const draftRes = await fetch('https://api.sleeper.app/v1/draft/' + encodeURIComponent(draftId));
    if (!draftRes.ok) throw new Error('Sleeper draft not found (Status ' + draftRes.status + ')');
    const draftData = await draftRes.json();

    let usersData = [];
    if (draftData.league_id) {
      try {
        const usersRes = await fetch('https://api.sleeper.app/v1/league/' + encodeURIComponent(draftData.league_id) + '/users');
        if (usersRes.ok) usersData = await usersRes.json();
      } catch (uErr) { /* users fetch optional */ }
    }

    const parsed = parseSleeperDraft(draftData, usersData, username);
    if (!parsed) throw new Error('Could not parse Sleeper draft configuration');

    state.settings.leagueName = parsed.leagueName;
    state.settings.teams = parsed.teams;
    state.settings.rounds = parsed.rounds;
    state.settings.mode = parsed.mode;
    state.settings.teamNames = parsed.teamNames;
    state.settings.slot = parsed.slot;

    save();
    bindHeaderControls();
    render();

    if (statusEl) {
      statusEl.innerHTML = '<span style="color:var(--good); font-weight:600">✅ Successfully imported '
        + parsed.teams + '-team league: <b>' + parsed.leagueName + '</b> (' + parsed.mode.toUpperCase() + ') · Assigned Slot ' + parsed.slot + '!</span>';
    }
    reportServerEvent('🏈 Sleeper Draft Connected: ' + parsed.leagueName + ' (' + parsed.teams + '-team ' + parsed.mode.toUpperCase() + ') · Assigned Slot ' + parsed.slot, 'success');
  } catch (err) {
    console.error('Sleeper import error:', err);
    if (statusEl) {
      statusEl.innerHTML = '<span style="color:var(--bad)">❌ Failed to import from Sleeper: ' + err.message + '</span>';
    }
  }
}

async function pollSleeperPicks() {
  const draftId = state.settings.sleeperDraftId || extractSleeperDraftId($('sync_sleeper_draft_id')?.value);
  if (!draftId) return;

  try {
    const res = await fetch('https://api.sleeper.app/v1/draft/' + encodeURIComponent(draftId) + '/picks');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const picks = await res.json();

    if (Array.isArray(picks)) {
      syncState.sleeperPicksCount = picks.length;
      syncState.sleeperLastPoll = new Date().toLocaleTimeString();
      syncState.sleeperStatus = 'Active (' + picks.length + ' picks)';

      const prevLen = state.log.length;
      const rec = reconcileDraftLog(state.log, picks, PLAYERS, state.settings);
      if (rec.changed) {
        state.log = rec.log;
        const taken = takenMap();
        state.watchlist = cleanWatchlist(state.watchlist, taken);
        save();
        render();

        if (rec.added > 0) {
          for (let i = prevLen; i < state.log.length; i++) {
            const entry = state.log[i];
            const p = entry.playerId != null ? PLAYERS[entry.playerId] : null;
            const name = entry.customName || (p ? p.name : 'Unknown');
            const pos = entry.customPos || (p ? p.pos : '');
            const team = entry.customTeam || (p ? p.team : '');
            const who = teamForOverall(entry.overall, state.settings.teams, state.settings.mode, state.settings.teamNames, state.settings.slot);
            reportServerPick({
              source: 'sleeper',
              overall: entry.overall,
              name: name,
              pos: pos,
              team: team,
              by: who.name + (who.isMe ? ' (You)' : '')
            });
          }
        }
        if (rec.rolledBack > 0) {
          reportServerEvent('↩️ Rolled back ' + rec.rolledBack + ' pick(s) to match Sleeper history (Now at #' + state.log.length + ')', 'warn');
        }
      }
    }
    updateSyncBadge();
    updateSleeperStatusBox();
  } catch (err) {
    syncState.sleeperStatus = 'Polling error: ' + err.message;
    updateSleeperStatusBox();
  }
}

    + '<button type="button" class="tab' + (syncState.activeTab === 'espn' ? ' on' : '') + '" id="sync_tab_espn" onclick="switchSyncTab(\'espn\')">📺 ESPN Extension Sync</button>'
    + '<button type="button" class="tab' + (syncState.activeTab === 'settings' ? ' on' : '') + '" id="sync_tab_settings" onclick="switchSyncTab(\'settings\')">⚙️ Cues & Options</button>'
    + '</div>'
    // --- Sleeper Tab ---
    + '<div id="sync_sec_sleeper" style="display:' + (syncState.activeTab === 'sleeper' ? 'block' : 'none') + '">'
    + '<div class="setup-grid" style="grid-template-columns: 1fr 1fr; gap:10px">'
    + '<div class="setup-field" style="grid-column: 1 / -1;"><label>Sleeper Draft ID or League URL</label><input type="text" id="sync_sleeper_draft_id" placeholder="e.g. 10492850284 or https://sleeper.com/draft/nfl/1049..." value="' + sleeperIdVal.replace(/"/g, '&quot;') + '"></div>'
    + '<div class="setup-field" style="grid-column: 1 / -1;"><label>Your Sleeper Username (Optional for Auto-Slot Matching)</label><input type="text" id="sync_sleeper_username" placeholder="e.g. Ken" value="' + sleeperUserVal.replace(/"/g, '&quot;') + '"></div>'
    + '</div>'
    + '<div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:12px">'
    + '<button type="button" class="act" onclick="importSleeperLeague()">📥 Import League & Order</button>'
    + '<button type="button" class="act primary" id="sleeper_toggle_btn" onclick="toggleSleeperSync()">' + (syncState.sleeperTimer ? '⏸ Pause Live Polling' : '▶ Start Live Sync (2s Polling)') + '</button>'
    + '</div>'
    + '<div id="sleeper_import_msg" style="margin-top:10px; font-size:12.5px"></div>'
    + '<div class="sync-status-box" id="sleeper_status_box"></div>'
    + '</div>'
    // --- ESPN Tab ---
    + '<div id="sync_sec_espn" style="display:' + (syncState.activeTab === 'espn' ? 'block' : 'none') + '">'
    + '<div style="background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:12px">'
    + '<div style="font-size:13.5px; font-weight:700; color:var(--text); margin-bottom:6px">🔌 ESPN Live Sync Extension Setup</div>'
    + '<div style="font-size:12px; color:var(--dim); line-height:1.6">'
    + 'Streams live picks from ESPN automatically with 0 clicks during the draft:'
    + '<ol style="margin:8px 0 10px 18px; padding:0">'
    + '<li>Open <code style="color:var(--accent); background:var(--bg); padding:1px 5px; border-radius:3px">chrome://extensions</code> or <code style="color:var(--accent); background:var(--bg); padding:1px 5px; border-radius:3px">edge://extensions</code> in your browser.</li>'
    + '<li>Toggle on <b>Developer mode</b> in the top-right corner.</li>'
    + '<li>Click <b>Load unpacked</b> and select the extension folder:</li>'
    + '</ol>'
    + '</div>'
    + '<div style="display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 12px">'
    + '<code id="ext_path_text" style="color:var(--good); font-size:12px; user-select:all; flex:1; overflow:hidden; text-overflow:ellipsis">d:\\Programming\\FantasyDrafter\\extensions\\espn-sync</code>'
    + '<button type="button" class="act" id="copy_ext_btn" onclick="copyExtensionPath()" style="padding:4px 10px; font-size:12px">📋 Copy Path</button>'
    + '</div>'
    + '</div>'
    + '<div class="sync-status-box" id="espn_status_box"></div>'
    + '<div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center">'
    + '<span style="font-size:11.5px; color:var(--dim)">Auto-connects when ESPN draft room is open</span>'
    + '<button type="button" class="act" onclick="sendEspnPing()">🔄 Ping ESPN Tab</button>'
    + '</div>'
    + '</div>'
    // --- Settings Tab ---
    + '<div id="sync_sec_settings" style="display:' + (syncState.activeTab === 'settings' ? 'block' : 'none') + '">'
    + '<div style="display:flex; flex-direction:column; gap:10px; margin-top:8px">'
    + '<label style="display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer"><input type="checkbox" id="sync_opt_chime"' + (s.audioChime ? ' checked' : '') + '> 🔔 Play auditory chime when our team is on the clock</label>'
    + '<label style="display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer"><input type="checkbox" id="sync_opt_pulse"' + (s.visualPulse ? ' checked' : '') + '> ✨ Pulsing green visual glow on header clock during our turn</label>'
    + '<label style="display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer"><input type="checkbox" id="sync_opt_unlisted"' + (s.autoUnlistedSync ? ' checked' : '') + '> 📝 Auto-draft unlisted players if not found in consensus rankings</label>'
    + '<label style="display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer"><input type="checkbox" id="sync_opt_rollback"' + (s.syncRollback ? ' checked' : '') + '> ↩ Auto-reconcile picks if commissioner rolls back a pick</label>'
    + '</div>'
    + '<div style="margin-top:14px; display:flex; gap:8px">'
    + '<button type="button" class="act" onclick="playPickChime()">🔔 Test Audio Chime</button>'
    + '<button type="button" class="act primary" onclick="saveSyncSettings()">Save Options</button>'
    + '</div>'
    + '</div>'
    + '<div class="modal-actions" style="margin-top:18px">'
    + '<button type="button" class="act" onclick="closeModal()">Close</button>'
    + '</div>';

  $('overlay').classList.add('show');
  updateSleeperStatusBox();
  updateEspnStatusBox();
  sendEspnPing();
}

function saveSyncSettings() {
  state.settings.audioChime = $('sync_opt_chime') ? $('sync_opt_chime').checked : true;
  state.settings.visualPulse = $('sync_opt_pulse') ? $('sync_opt_pulse').checked : true;
  state.settings.autoUnlistedSync = $('sync_opt_unlisted') ? $('sync_opt_unlisted').checked : true;
  state.settings.syncRollback = $('sync_opt_rollback') ? $('sync_opt_rollback').checked : true;
  save();
  closeModal();
  render();
}

// ---------- Settings Wiring ----------
function bindHeaderControls() {
  const s = state.settings;
  $('rounds').value = s.rounds;
  $('mode').value = s.mode;
  if ($('hdrscoring')) $('hdrscoring').value = s.scoring;
  if ($('hdrqb')) $('hdrqb').value = s.qbFormat;
  $('teprem').checked = s.teprem;
  $('blend').value = s.blend;
  $('blendval').textContent = s.blend + '%';
}

function bindSettings() {
  bindHeaderControls();
  const on = (id, ev, fn) => $(id).addEventListener(ev, fn);
  on('hdrslot', 'change', () => {
    state.settings.slot = +$('hdrslot').value || 1;
    save(); render();
  });
  on('hdrscoring', 'change', () => {
    state.settings.scoring = $('hdrscoring').value;
    save(); render();
  });
  on('hdrqb', 'change', () => {
    state.settings.qbFormat = $('hdrqb').value;
    save(); render();
  });
  on('rounds', 'change', () => {
    state.settings.rounds = Math.max(1, +$('rounds').value || 25);
    const rs = state.settings.rosterSlots || DEFAULT_ROSTER_SLOTS;
    const starters = (rs.qb || 0) + (rs.rb || 0) + (rs.wr || 0) + (rs.te || 0) +
                     (rs.flex || 0) + (rs.superflex || 0) + (rs.k || 0) + (rs.dst || 0);
    state.settings.rosterSlots.bench = Math.max(0, state.settings.rounds - starters);
    save(); render();
  });
  on('mode', 'change', () => { state.settings.mode = $('mode').value; save(); render(); });
  on('teprem', 'change', () => { state.settings.teprem = $('teprem').checked; save(); render(); });
  on('blend', 'input', () => {
    state.settings.blend = +$('blend').value;
    $('blendval').textContent = state.settings.blend + '%';
    save(); renderPool();
  });
  on('search', 'input', () => { ui.search = $('search').value; renderPool(); });
  on('sortsel', 'change', () => { ui.sort = $('sortsel').value; renderPool(); });
  on('hidetaken', 'change', () => { ui.hideTaken = $('hidetaken').checked; renderPool(); });
  on('undobtn', 'click', undo);
  on('resetbtn', 'click', resetDraft);
  on('unknownbtn', 'click', openUnlistedPickModal);
  on('jumpbtn', 'click', () => { const v = +$('jumppick').value; if (v) jumpTo(v); });
  on('setupbtn', 'click', openLeagueSetup);
  on('rosterTeamSelect', 'change', () => {
    selectRosterSlot($('rosterTeamSelect').value);
  });
  on('overlay', 'click', e => { if (e.target.id === 'overlay') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
}

bindSettings();
initBroadcastSync();
renderTabs();
render();
</script>
</body>
</html>
